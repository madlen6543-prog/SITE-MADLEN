<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדלן פריד | Link in Bio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'Assistant', 'sans-serif'],
                    },
                    colors: {
                        galaxy: {
                            dark: '#05040d',
                            pink: '#EC4899',
                            purple: '#A855F7',
                            blue: '#3B82F6',
                            cyan: '#06B6D4'
                        }
                    },
                    animation: {
                        'ambientMove1': 'ambientMove1 22s ease-in-out infinite',
                        'ambientMove2': 'ambientMove2 28s ease-in-out infinite',
                    },
                    keyframes: {
                        ambientMove1: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '50%': { transform: 'translate(-30px, 40px) scale(1.15)' }
                        },
                        ambientMove2: {
                            '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
                            '50%': { transform: 'translate(40px, -30px) scale(1.2)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #05040d;
            color: #f3f4f6;
            font-family: 'Heebo', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Neon Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #F472B6 0%, #C084FC 50%, #60A5FA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Avatar Glow ring - Slow Ombre Blend */
        .avatar-ring {
            position: relative;
        }
        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 50%, #3b82f6 100%);
            background-size: 200% 200%;
            animation: moveGradient 14s ease infinite;
            z-index: -1;
            filter: blur(8px);
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen py-10 px-4 select-none">

    <!-- Soft Ambient Color Atmosphere -->
    <div class="fixed top-1/4 -right-20 w-96 h-96 bg-pink-600/15 rounded-full blur-[150px] pointer-events-none z-0 animate-ambientMove1"></div>
    <div class="fixed bottom-1/3 -left-20 w-[30rem] h-[30rem] bg-purple-600/15 rounded-full blur-[170px] pointer-events-none z-0 animate-ambientMove2"></div>
    <div class="fixed top-2/3 right-1/4 w-80 h-80 bg-blue-600/15 rounded-full blur-[140px] pointer-events-none z-0 animate-ambientMove1"></div>

    <!-- Main Container Card -->
    <main class="relative z-10 w-full max-w-md flex flex-col items-center my-auto">

        <!-- Profile Header Section -->
        <section class="flex flex-col items-center text-center w-full mb-8">
            <!-- Profile Avatar with animated gradient glow -->
            <div class="avatar-ring mb-4">
                <div class="relative w-28 h-28 rounded-full overflow-hidden border-2 border-white/20 bg-slate-900 shadow-2xl flex items-center justify-center">
                    <img id="profile-img" src="https://raw.githubusercontent.com/madlen6543-prog/IMAGES-/a5de83d14f09f15e476e37ac3aac27de97903f0d/WhatsApp%20Image%202026-08-12%20at%2013.24.55.jpeg" alt="מדלן פריד" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x300/1e1b4b/ffffff?text=מדלן+פריד'">
                </div>
            </div>

            <!-- Name and Title -->
            <h1 id="profile-name" class="text-3xl font-extrabold tracking-tight text-white mb-2 drop-shadow-md">
                מדלן פריד
            </h1>
            
            <!-- Tagline with text gradient and native phone emoji -->
            <p id="profile-title" class="text-base font-semibold tracking-wide mb-3 flex items-center justify-center gap-1.5">
                <span class="text-gradient">לבטא את עצמך באותנטיות</span>
                <span class="inline-block text-lg leading-none select-none">🗣️</span>
            </p>

            <!-- Bio Description -->
            <p id="profile-bio" class="text-xs text-gray-300 leading-relaxed max-w-xs px-2 font-light">
                מלווה מופנמים וביישנים לבטא את עצמם בביטחון ובחופשיות מול אנשים.
            </p>

        </section>

        <!-- Main Links Section -->
        <section class="w-full flex flex-col gap-3.5 mb-8" id="links-list">

            <!-- Link 1: Fit Questionnaire -->
            <a href="https://madlenfrid.netlify.app/" target="_blank" class="group relative rounded-2xl p-[1px] bg-gradient-to-r from-pink-500/30 via-purple-500/30 to-blue-500/30 hover:from-pink-500 hover:via-purple-500 hover:to-blue-500 transition-all duration-300 shadow-lg hover:shadow-pink-500/20">
                <div class="w-full h-full bg-slate-950/80 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center justify-between group-hover:bg-slate-900/80 transition-all">
                    <div class="flex items-center gap-3.5">
                        <span class="text-2xl select-none shrink-0 group-hover:scale-110 transition-transform">
                            📋
                        </span>
                        <div class="flex flex-col text-right">
                            <h2 class="text-sm font-bold text-white group-hover:text-pink-300 transition-colors">שאלון התאמה לקביעת פגישה</h2>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-gray-500 group-hover:text-pink-400 group-hover:-translate-x-1 transition-all text-xs mr-2"></i>
                </div>
            </a>

            <!-- Link 2: Direct WhatsApp Message -->
            <a href="https://wa.me/972524073915?text=%D7%94%D7%99%D7%99%20%D7%9E%D7%93%D7%9C%D7%9F%2C%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A2%D7%9C%20%D7%94%D7%AA%D7%90%D7%9C%D7%99%D7%9A%21" target="_blank" class="group relative rounded-2xl p-[1px] bg-gradient-to-r from-emerald-500/30 via-teal-500/30 to-blue-500/30 hover:from-emerald-500 hover:via-teal-500 hover:to-blue-500 transition-all duration-300 shadow-lg hover:shadow-emerald-500/20">
                <div class="w-full h-full bg-slate-950/80 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center justify-between group-hover:bg-slate-900/80 transition-all">
                    <div class="flex items-center gap-3.5">
                        <span class="text-2xl select-none shrink-0 group-hover:scale-110 transition-transform">
                            💬
                        </span>
                        <div class="flex flex-col text-right">
                            <h2 class="text-sm font-bold text-white group-hover:text-emerald-300 transition-colors">שליחת הודעה ב-WhatsApp</h2>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-gray-500 group-hover:text-emerald-400 group-hover:-translate-x-1 transition-all text-xs mr-2"></i>
                </div>
            </a>

            <!-- Link 3: Free Gift Guide -->
            <a href="https://madlenfrid.netlify.app/form/" target="_blank" class="group relative rounded-2xl p-[1px] bg-gradient-to-r from-purple-500/30 via-pink-500/30 to-blue-500/30 hover:from-purple-500 hover:via-pink-500 hover:to-blue-500 transition-all duration-300 shadow-lg hover:shadow-purple-500/20">
                <div class="w-full h-full bg-slate-950/80 backdrop-blur-xl rounded-2xl px-4 py-3.5 flex items-center justify-between group-hover:bg-slate-900/80 transition-all">
                    <div class="flex items-center gap-3.5">
                        <span class="text-2xl select-none shrink-0 group-hover:scale-110 transition-transform">
                            🎁
                        </span>
                        <div class="flex flex-col text-right">
                            <h2 class="text-sm font-bold text-white group-hover:text-purple-300 transition-colors">מדריך במתנה ← מביישנות לביטחון עצמי</h2>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-gray-500 group-hover:text-purple-400 group-hover:-translate-x-1 transition-all text-xs mr-2"></i>
                </div>
            </a>

        </section>

    </main>

</body>
</html>
