
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שיחת התאמה עם מדלן</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff9fc;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #342b35;
    }

    .card {
      width: 90%;
      max-width: 360px;
      padding: 30px 20px;
    }

    h1 { font-size: 27px; }

    p {
      color: #655c66;
      line-height: 1.7;
    }

    .button {
      display: block;
      margin-top: 28px;
      padding: 18px;
      border-radius: 16px;
      background: #a95f8d;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .hint {
      margin-top: 24px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>בואו נכיר!</h1>
    <p>שיחת התאמה אישית ללא עלות עם מדלן.</p>

    <a id="chat" class="button"
       href="#">
      פתיחת שיחה בוואטסאפ
    </a>

    <p class="hint">
      אם וואטסאפ לא נפתח,
      ניתן לפתוח את העמוד בדפדפן Safari.
    </p>
  </main>

  <script>
    const phone = "972524073915";

    const message =
      "היי מדלן! אשמח לקבוע איתך שיחת התאמה " +
      "\u{1F60A}";

    const url =
      "https://wa.me/" + phone +
      "?text=" + encodeURIComponent(message);

    document.getElementById("chat").href = url;
  </script>
</body>
</html>
