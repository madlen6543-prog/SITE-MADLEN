<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדלן פריד - קישורים</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Heebo & Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'Assistant', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#080711',
                            card: 'rgba(255, 255, 255, 0.03)',
                            cardHover: 'rgba(255, 255, 255, 0.06)',
                            pink: '#ec4899',
                            purple: '#a855f7',
                            emerald: '#10b981'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070611;
            color: #f3f4f6;
            font-family: 'Heebo', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Ambient Glow Backgrounds */
        .ambient-glow-1 {
            position: fixed;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(236, 72, 153, 0.08) 50%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(16, 185, 129, 0.06) 50%, rgba(0,0,0,0) 70%);
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }

        /* Avatar Subtle Gradient Halo */
        .avatar-halo {
            position: relative;
        }
        .avatar-halo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 9999px;
            background: linear-gradient(135deg, rgba(236,72,153,0.8), rgba(168,85,247,0.8), rgba(59,130,246,0.8));
            opacity: 0.85;
            z-index: -1;
            filter: blur(6px);
            transition: opacity 0.3s ease;
        }

        /* Premium Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.065);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
        }

        .glass-card:active {
            transform: translateY(0);
        }

        /* Text Gradient */
        .text-gradient {
            background: linear-gradient(135deg, #f472b6 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-start min-h-screen pt-12 pb-10 px-4 select-none">

    <!-- Ambient Ambient Lighting -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <main class="relative z-10 w-full max-w-md flex flex-col items-center my-auto">

        <!-- Profile Header Section -->
        <section class="flex flex-col items-center text-center w-full mb-8">
            <!-- Profile Avatar -->
            <div class="avatar-halo mb-4">
                <div class="relative w-24 h-24 rounded-full overflow-hidden border border-white/20 bg-slate-900 shadow-2xl flex items-center justify-center">
                    <img id="profile-img" src="https://raw.githubusercontent.com/madlen6543-prog/IMAGES-/a5de83d14f09f15e476e37ac3aac27de97903f0d/WhatsApp%20Image%202026-08-12%20at%2013.24.55.jpeg" alt="מדלן פריד" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x300/1e1b4b/ffffff?text=מדלן+פריד'">
                </div>
            </div>

            <!-- Name -->
            <h1 id="profile-name" class="text-2xl font-extrabold tracking-tight text-white mb-1 drop-shadow-sm">
                מדלן פריד
            </h1>
            
            <!-- Tagline -->
            <p id="profile-title" class="text-sm font-semibold tracking-wide mb-3 flex items-center justify-center gap-1.5">
                <span class="text-gradient">לבטא את עצמך באותנטיות</span>
                <span class="text-xs opacity-90">🗣️</span>
            </p>

            <!-- Bio Description -->
            <p id="profile-bio" class="text-xs text-gray-300/90 leading-relaxed max-w-xs px-2 font-normal tracking-wide">
                מלווה מופנמים וביישנים לחזק ביטחון עצמי,<br>ולהתבטא יותר בשחרור מול אנשים.
            </p>
        </section>

        <!-- Links Container -->
        <section class="w-full flex flex-col gap-4" id="links-list">

            <!-- Link 1: Single Breakthrough Session Questionnaire -->
            <a href="https://madlenfrid.netlify.app/" target="_blank" class="group glass-card rounded-2xl px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400 group-hover:bg-pink-500/20 group-hover:scale-105 transition-all">
                        <i class="fa-regular fa-clipboard text-lg"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-100 group-hover:text-white transition-colors">לשאלון התאמה לפגישת פיצוח</span>
                </div>
                <i class="fa-solid fa-chevron-left text-gray-500 group-hover:text-pink-400 group-hover:-translate-x-1 transition-all text-xs"></i>
            </a>

            <!-- Link 2: Direct WhatsApp Message -->
            <a href="https://wa.me/972524073915?text=היי%20מדלן,%20אשמח%20לשמוע%20על%20התהליך%20!" target="_blank" class="group glass-card rounded-2xl px-5 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:bg-emerald-500/20 group-hover:scale-105 transition-all">
                        <i class="fa-regular fa-comment-dots text-lg"></i>
                    </div>
                    <span class="text-sm font-bold text-gray-100 group-hover:text-white transition-colors">אני רוצה לשמוע על התהליך !</span>
                </div>
                <i class="fa-solid fa-chevron-left text-gray-500 group-hover:text-emerald-400 group-hover:-translate-x-1 transition-all text-xs"></i>
            </a>

        </section>

    </main>

</body>
</html>
