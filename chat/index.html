
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>שיחת התאמה עם מדלן</title>
</head>
<body>
<script>
  const phone = "972524073915";

  const message =
    "היי מדלן! אשמח לקבוע איתך שיחת התאמה " +
    "\u{1F60A}";

  const url =
    "https://api.whatsapp.com/send?phone=" +
    phone +
    "&text=" +
    encodeURIComponent(message);

  window.location.replace(url);
</script>
</body>
</html>
