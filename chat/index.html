
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>שיחת התאמה עם מדלן</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff9fc;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #fallback {
      display: none;
      padding: 24px;
    }

    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 30px;
      background: #b9709b;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="fallback">
    <p>למעבר לשיחת התאמה עם מדלן</p>
    <a id="whatsapp-link" href="#">
      פתיחת וואטסאפ
    </a>
  </div>

  <script>
    const phone = "972524073915";

    const message =
      "\u05d4\u05d9\u05d9 \u05de\u05d3\u05dc\u05df! " +
      "\u05d0\u05e9\u05de\u05d7 " +
      "\u05dc\u05e7\u05d1\u05d5\u05e2 " +
      "\u05d0\u05d9\u05ea\u05da " +
      "\u05e9\u05d9\u05d7\u05ea " +
      "\u05d4\u05ea\u05d0\u05de\u05d4 " +
      "\u{1F60A}";

    const url =
      "https://api.whatsapp.com/send?phone=" +
      phone +
      "&text=" +
      encodeURIComponent(message);

    document.getElementById(
      "whatsapp-link"
    ).href = url;

    setTimeout(() => {
      document.getElementById(
        "fallback"
      ).style.display = "block";
    }, 1800);

    window.location.replace(url);
  </script>
</body>
</html>
